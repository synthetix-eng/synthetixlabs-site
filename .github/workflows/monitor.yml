name: Monitor

# Uptime + content-drift monitoring for the live site.
#
# On a git-backed static site any content change that did not come from a
# commit is by definition unauthorised. This job compares the sha256 of every
# live page against the file in main. It is the monitoring that was missing
# when the original site was compromised twice.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to verify'
        required: false
        default: 'https://synthetixlabs-site.web.app'

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify live site
        id: verify
        run: |
          URL="${{ github.event.inputs.base_url || 'https://synthetixlabs-site.web.app' }}"
          ./scripts/verify-live.sh "$URL" 2>&1 | tee /tmp/verify.log
        continue-on-error: true

      - name: Open an issue if verification failed
        if: steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/verify.log', 'utf8').slice(-5000);
            const title = 'Live site verification FAILED';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'monitoring'
            });
            const body = [
              'Automated verification of the live site failed.',
              '',
              'On a git-backed static site, content that differs from `main` did not',
              'come from a commit — treat drift as unauthorised change until proven',
              'otherwise. Do NOT redeploy over it before capturing what is live.',
              '',
              '```', log, '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            if (existing.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['monitoring']
              });
            }

      - name: Fail the run if verification failed
        if: steps.verify.outcome == 'failure'
        run: exit 1

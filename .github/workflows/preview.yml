name: Preview

# Deploys each pull request to its own Firebase preview channel so changes can
# be reviewed on a real URL before they reach live.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan-and-preview:
    # Fork PRs cannot mint an OIDC token, and should not be able to deploy.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Security scan (gates the preview)
        run: ./scripts/security-scan.sh

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/323979308345/locations/global/workloadIdentityPools/github/providers/github
          service_account: firebase-deployer@synthetixlabs-site.iam.gserviceaccount.com

      - name: Deploy preview channel
        id: preview
        run: |
          set -e
          CH="pr-${{ github.event.pull_request.number }}"
          out=$(npx --yes firebase-tools@15 hosting:channel:deploy "$CH" \
                  --expires 7d --project synthetixlabs-site --non-interactive 2>&1)
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]+--[a-z0-9-]+\.web\.app' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            if (!url) return;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed (security scan passed): ${url}\n\nExpires in 7 days.`
            });
